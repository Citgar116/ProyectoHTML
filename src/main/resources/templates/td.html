<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta td</title>
</head>

<body>

<h1 align="center">Etiqueta &lt;td&gt;</h1>
<hr>

<h2>¿Qué es la etiqueta &lt;td&gt;?</h2>

<p>
    La etiqueta <b>&lt;td&gt;</b> se utiliza para definir una celda dentro de una tabla.
    Las celdas contienen los datos que se mostrarán.
</p>

<hr>

<center>

    <h2>Ejemplo funcionando</h2>

    <table border="1">

        <tr>
            <td>Juan</td>
            <td>Ingeniería</td>
        </tr>

    </table>

</center>

<h2>Código del ejemplo</h2>

<pre>
&lt;table&gt;

&lt;tr&gt;
&lt;td&gt;Juan&lt;/td&gt;
&lt;td&gt;Ingeniería&lt;/td&gt;
&lt;/tr&gt;

&lt;/table&gt;
</pre>

</body>
</html>
